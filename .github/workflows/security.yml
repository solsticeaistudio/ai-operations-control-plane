name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency auditor
        run: python -m pip install pip-audit
      - name: Audit pinned direct dependencies against vulnerability advisories
        run: python -m pip_audit -r requirements.txt --no-deps --disable-pip

  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Bandit static analyzer
        run: python -m pip install bandit
      - name: Scan application code for medium/high severity issues
        run: bandit -q -r app -ll
